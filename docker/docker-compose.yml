version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nutrition-agent-api:latest
    container_name: nutrition-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
      - APP_ENV=production
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
    volumes:
      - chroma_data:/app/data/chroma_db
      - upload_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nutrition-net

  # ── Streamlit Dashboard ──────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nutrition-agent-ui:latest
    container_name: nutrition-agent-ui
    restart: unless-stopped
    command: streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
      - APP_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nutrition-net

volumes:
  chroma_data:
    driver: local
  upload_data:
    driver: local

networks:
  nutrition-net:
    driver: bridge
